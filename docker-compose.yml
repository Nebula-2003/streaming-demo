# LiveKit: set LIVEKIT_ADVERTISE_IP in .env to this machine's LAN or public IP
# (required for viewers on other devices; localhost-only can use 127.0.0.1)
services:
  livekit:
    image: livekit/livekit-server:latest
    command:
      - --keys
      # Secret must be ≥32 chars (LiveKit rejects short secrets outside --dev)
      - "devkey: f6d5c4b3a2918e7d6c5b4a39281706f5"
      - --node-ip
      - "${LIVEKIT_ADVERTISE_IP:-127.0.0.1}"
    ports:
      - "7880:7880"
      - "7881:7881"
      # Wide UDP range for WebRTC media (was a single port — bottleneck under load)
      - "50000-50200:50000-50200/udp"
    restart: unless-stopped
    environment:
      - LIVEKIT_BIND_ADDRESSES=0.0.0.0
      - LIVEKIT_ADVERTISE_IP=${LIVEKIT_ADVERTISE_IP:-127.0.0.1}
      - LIVEKIT_RTC_PORT_RANGE_START=50000
      - LIVEKIT_RTC_PORT_RANGE_END=50200
    networks:
      - livekit-network

networks:
  livekit-network:
    driver: bridge
