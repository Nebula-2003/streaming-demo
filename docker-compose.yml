services:
  livekit:
    image: livekit/livekit-server:latest
    # Host networking: LiveKit binds directly on the host interface.
    # No docker port-mapping → no iptables rules → avoids "port already in use"
    # conflicts from other processes scattering UDP sockets.
    network_mode: host
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }
    environment:
      NODE_IP: ${LIVEKIT_ADVERTISE_IP:-127.0.0.1}
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}"
      LIVEKIT_CONFIG: |
        port: ${LIVEKIT_WS_PORT:-17880}
        bind_addresses: [0.0.0.0]
        rtc:
          tcp_port: ${LIVEKIT_RTC_TCP_PORT:-17881}
          port_range_start: ${LIVEKIT_UDP_START:-40000}
          port_range_end: ${LIVEKIT_UDP_END:-41000}
          use_external_ip: true
        turn:
          enabled: false
        room:
          empty_timeout: 300
          max_participants: 1000
